[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optpred"
version = "0.1.0"
description = "Short-term direction of NIFTY options, after costs (DA3408 course project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# PEP 8 (E, W), pyflakes (F), import order (I), bugbear (B), modern syntax (UP).
select = ["E", "F", "W", "I", "B", "UP"]
