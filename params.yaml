# Every tunable number of the pipeline lives here. DVC re-runs a stage when
# the parameters it declares change.

export:
  clickhouse_url: http://127.0.0.1:9100   # Ravion ClickHouse HTTP port (localhost only)
  start_date: "2026-08-03"                 # first day option_chain_snap exists
  end_date: "2026-10-16"                  # frozen snapshot end; null = today
  out_dir: data/raw
  timeout_s: 600
  tables: [opt_tape, und_tape, option_chain_snap]

spark:
  cores: 4                 # VPS has 8; the other 4 stay with live trading
  driver_memory: 6g
  shuffle_partitions: 16

check:
  min_coverage: 0.95       # a day needs data in >= 95% of the 375 session minutes

eda:                       # cleaning rules and missing-value policy (docs/steps/eda.md)
  clean_dir: data/clean
  workers: 2               # one day per worker; ~3 GB RAM each
  spread_min_mid: 1.0      # below Rs1 the 0.05 tick dominates the relative spread
  max_rel_spread: 0.25     # spread > 25% of mid on a >=Rs1 option = stale side of the book
  max_mid_jump: 0.20       # a >20% mid jump that reverts on the next tick = bad print
  close_from_s: 55680      # 15:28:00: NSE closing-price print window
  close_max_jump: 0.0015   # an index tick jump > 0.15% there = closing print
  max_spot_gap_pts: 25     # chain spot more than 25 pts from the index = stale chain
  max_age_s:               # forward fill limit per table (optpred.eda.fill)
    opt_tape: 20
    index: 5
    future: 30
    option_chain_snap: 30

grid:                      # model-ready 1-second table (optpred.transform.grid)
  out_dir: data/grid
  strike_step: 50
  n_strikes: 2             # legs ATM-2 .. ATM+2, CE and PE

feat:                      # feature library (optpred.featurelib); add features in featurelib/groups/
  out_dir: data/feat
  groups: all              # or a list, e.g. [time, spot, book]

labels:                    # triple-barrier targets (optpred.labels.barrier). Set before any model result
  out_dir: data/labels
  qty: 65                  # one NIFTY lot
  slippage_pts_per_leg: 0.0  # entry at ask / exit at bid already pays the spread; 1 lot fits in L1
  min_entry_premium: 5.0   # below Rs5 the 0.05 tick makes the spread too large (EDA)
  max_entry_age_s: 5       # the entry quote must be fresh
  first_entry_s: 33600     # 09:20: features have 300 s of history
  last_entry_s: 54900      # 15:15
  force_exit_s: 55680      # 15:28: before the closing print
  sigma_window_s: 300
  sigma_horizon_s: 60      # sigma = 1-minute move of the option, in points
  k_tp: 2.0
  k_sl: 2.0
  max_hold_s: 900          # safety cap, not a fixed horizon

zoo:                       # model zoo: training + evaluation (optpred.zoo). Grid fixed before any zoo result
  n_test_days: 10          # last 10 accepted days: test (only zoo_eval reads them)
  min_train_days: 19       # walk-forward: first fold trains on 19 days
  val_days: 5              # each fold validates on the next 5 days -> 4 folds on 39 dev days
  tau_quantiles: [0.9, 0.95, 0.98, 0.99, 0.995, 0.999]   # trade only the top share of seconds
  min_trades: 20           # a tau needs at least this many validation trades
  cpus: 4                  # the other 4 stay with live trading
  bootstrap: 5000
  seed: 20261023
  mlflow:
    tracking_uri: "sqlite:///mlflow/mlflow.db"   # env MLFLOW_TRACKING_URI overrides
    artifact_root: mlflow/artifacts
    experiment: nifty-zoo
    registered_model: nifty-signal
  grid:                    # one Ray Tune trial per entry
    stay_out: [{}]
    random: [{seed: 1}]
    momentum: [{window: 15}, {window: 60}, {window: 300}]
    linear: [{alpha: 1.0}, {alpha: 100.0}, {alpha: 10000.0}]
    lgbm_reg:
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 200}
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 2000}
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 63, min_child_samples: 200}
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 63, min_child_samples: 2000}
    lgbm_clf:
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 200}
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 2000}
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 63, min_child_samples: 200}
      - {n_estimators: 300, learning_rate: 0.03, num_leaves: 63, min_child_samples: 2000}
    meta:
      - {window: 60, n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 500}
      - {window: 60, n_estimators: 300, learning_rate: 0.03, num_leaves: 31, min_child_samples: 500}
    gru:
      - {hidden: 32, seq_len: 60, epochs: 3, lr: 0.001}
      - {hidden: 64, seq_len: 60, epochs: 3, lr: 0.001}
    transformer:
      - {hidden: 32, heads: 4, layers: 1, seq_len: 60, epochs: 3, lr: 0.001}
      - {hidden: 32, heads: 4, layers: 2, seq_len: 60, epochs: 3, lr: 0.001}

drift:                     # data drift by PSI (optpred.drift). Online (API) and per day (stage drift)
  n_bins: 10
  psi_limit: 0.25          # PSI above this = the feature drifted
  share_limit: 0.3         # drift = more than 30% of features drifted
  window: 1000             # online: served rows in the window
  min_rows: 300            # online: no verdict before this many rows
  n_windows: 300           # online limits: PSI of this many random dev windows (window rows each)
  seed: 20261023
