# Every tunable number of the pipeline lives here. DVC re-runs a stage when
# the parameters it declares change.

export:
  clickhouse_url: http://127.0.0.1:9100   # Ravion ClickHouse HTTP port (localhost only)
  start_date: "2026-08-03"                 # first day option_chain_snap exists
  end_date: "2026-10-16"                  # frozen snapshot end; null = today
  out_dir: data/raw
  timeout_s: 600
  tables: [opt_tape, und_tape, option_chain_snap]

spark:
  cores: 4                 # VPS has 8; the other 4 stay with live trading
  driver_memory: 6g
  shuffle_partitions: 16

check:
  min_coverage: 0.95       # a day needs data in >= 95% of the 375 session minutes

eda:                       # cleaning rules and missing-value policy (docs/steps/eda.md)
  clean_dir: data/clean
  workers: 2               # one day per worker; ~3 GB RAM each
  spread_min_mid: 1.0      # below Rs1 the 0.05 tick dominates the relative spread
  max_rel_spread: 0.25     # spread > 25% of mid on a >=Rs1 option = stale side of the book
  max_mid_jump: 0.20       # a >20% mid jump that reverts on the next tick = bad print
  close_from_s: 55680      # 15:28:00: NSE closing-price print window
  close_max_jump: 0.0015   # an index tick jump > 0.15% there = closing print
  max_spot_gap_pts: 25     # chain spot more than 25 pts from the index = stale chain
  max_age_s:               # forward fill limit per table (optpred.eda.fill)
    opt_tape: 20
    index: 5
    future: 30
    option_chain_snap: 30

grid:                      # model-ready 1-second table (optpred.transform.grid)
  out_dir: data/grid
  strike_step: 50
  n_strikes: 2             # legs ATM-2 .. ATM+2, CE and PE

feat:                      # feature library (optpred.featurelib); add features in featurelib/groups/
  out_dir: data/feat
  groups: all              # or a list, e.g. [time, spot, book]

bars:
  out_dir: data/bars

ticks:                     # v2: one row per contract per second (docs/V2_PROTOCOL.md)
  out_dir: data/ticks
  strike_margin: 150       # keep nearest-expiry strikes within this many points of the day's NIFTY range

features:
  out_dir: data/features
  horizon_min: 2           # hold time; fixed BEFORE looking at any result (docs/HLD.md section 1.2)
  first_minute: 560        # 09:20 -- five minutes of history exist
  qty: 65                  # one lot
  strike_step: 50
  entry_max_age_s: 20      # the quote used to enter must be at most this old
  min_entry_premium: 5.0   # skip near-worthless contracts (known at entry, so applied to everything)
  n_val_days: 6
  n_test_days: 10
  forward_from: "2026-10-17"   # days from here on were recorded after v1 was frozen: split "forward"

micro:                     # v2 decision rows and barrier trades. FIXED in docs/V2_PROTOCOL.md: never tune these
  out_dir: data/micro
  qty: 65
  strike_step: 50
  first_sec: 33600         # 09:20:00
  last_sec: 55500          # 15:25:00: a 180 s time stop still exits by 15:28
  entry_max_age_s: 5
  min_entry_premium: 5.0
  take_profit_pts: 3.5
  stop_loss_pts: 2.0
  max_hold_s: 180
  # alpha sprint (docs/ALPHA_SPRINT.md), fixed before any sprint result
  trail_start_pts: 2.0     # trial C: the stop starts trailing once the bid is this far above entry
  trail_pts: 2.0           # trial C: distance of the trailing stop below the best bid since entry
  trail_max_hold_s: 300    # trial C: time stop
  sweep_min_ask_jump: 0.10 # trial E: best ask rises at least this much in one second
  sweep_min_lots: 2        # trial E: aggressive buy volume in that second, in lots
  big_move_horizon_s: 120  # trial A: horizon of the spot excursion label
  slippage_pts_per_leg: 0.0  # v2 headline cost: statutory only (docs/V2_PROTOCOL.md amendment 1). v1 keeps costs.*

micro_train:               # v2 model (docs/V2_PROTOCOL.md section 6). Settings fixed before any v2 result
  n_folds: 3
  min_train_days: 14
  train_stride: 5          # train on every 5th second: neighbours share almost all their inputs
  tau_grid: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 1.01]   # 1.01 = never trade
  min_oof_trades: 20
  seed: 20261022
  registered_model: nifty-option-micro
  lgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 1000
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 5.0
    n_jobs: 4

costs:
  # Charged ON TOP of crossing the spread (entry at ask, exit at bid). Ravion measured 0.31
  # on 10 live legs; its code charges 0.31 * 2 legs * qty = Rs40.3 per round trip while its
  # comments say Rs25. Reported at several values, never silently one.
  slippage_pts_per_leg: 0.31
  sensitivity_pts_per_leg: [0.0, 0.15, 0.31]

baselines:
  random_seeds: 100
  bootstrap_resamples: 5000
  seed: 20261018

train:
  seed: 20261018
  n_jobs: 4
  early_stopping_rounds: 50
  threshold_grid: [0.0, 0.4, 0.45, 0.5, 0.55, 0.6, 0.7, 1.01]   # 1.01 = never trade
  use_tuned: false         # true = train with the settings in reports/tune.json (from `tune`)
  min_val_trades: 30       # a threshold with fewer validation trades is not trusted
  lgbm:
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 5.0

tune:                      # Ray Tune: search LightGBM settings on train days only
  n_folds: 3               # walk-forward folds (expanding window, by day)
  min_train_days: 14       # the first fold trains on at least this many days
  num_samples: 16          # settings tried
  cpus: 4
  cpus_per_trial: 2
  concurrent: 2
  space:
    num_leaves: [7, 15, 31]
    min_child_samples: [50, 100, 200]
    learning_rate: [0.01, 0.1]       # log-uniform range
    colsample_bytree: [0.5, 1.0]
    reg_lambda: [1.0, 20.0]          # log-uniform range

drift:
  window: 2000            # served rows kept: about 5 sessions. One day is too short (docs/HLD.md section 5)
  min_rows: 1000          # no drift verdict before this many rows. Env DRIFT_MIN_ROWS overrides (demo)
  psi_limit: 0.25         # env DRIFT_PSI_LIMIT overrides (demo)
  max_feature_share: 0.3  # drift is declared when more than this share of features pass the limit

mlflow:
  tracking_uri: "sqlite:///mlflow/mlflow.db"   # env MLFLOW_TRACKING_URI overrides (e.g. the compose server)
  artifact_root: mlflow/artifacts
  experiment: nifty-option-direction
  registered_model: nifty-option-direction
