<rect x='930' y='60' width='260' height='650' rx='12' fill='#f5f6f8' fill-opacity='.45' stroke='#9aa3af' stroke-dasharray='5 4'/>
<text x='942' y='82' font-size='13' font-weight='700' fill='#9aa3af' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Design rules</text>
<text x='946' y='106' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>1  No look-ahead.</text>
<text x='946' y='121' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Every input uses data up to its</text>
<text x='946' y='136' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>second. Gaps: forward fill</text>
<text x='946' y='151' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>with an age limit.</text>
<text x='946' y='204' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>2  One definition of a trade.</text>
<text x='946' y='219' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Buy at the ask, sell at the bid,</text>
<text x='946' y='234' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>statutory costs. Labels,</text>
<text x='946' y='249' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>simulator and API share it.</text>
<text x='946' y='302' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>3  The day is the unit.</text>
<text x='946' y='317' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Stages run per day (Ray).</text>
<text x='946' y='332' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Splits are by whole day.</text>
<text x='946' y='400' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>4  Choose on validation,</text>
<text x='946' y='415' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>report on test.</text>
<text x='946' y='430' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Test days are scored once.</text>
<text x='946' y='498' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>5  Everything is a stage.</text>
<text x='946' y='513' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>DVC runs it; the run journal and</text>
<text x='946' y='528' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>MLflow record the commit.</text>
<text x='946' y='596' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>6  Loose coupling.</text>
<text x='946' y='611' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>The page knows only the API</text>
<text x='946' y='626' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>address (config.json).</text>
<text x='946' y='641' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Functional stages: files in,</text>
<text x='946' y='656' font-size='12' font-weight='400' fill='#14171c' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>files out.</text>
