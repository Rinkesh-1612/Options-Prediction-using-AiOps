# One receiver: the API. It retrains on DriftDetected and ModelLosing (with a cooldown) and logs the rest.
route:
  receiver: api
  group_by: [alertname]
  group_wait: 5s
  repeat_interval: 1h
receivers:
  - name: api
    webhook_configs:
      - url: http://api:8000/alerts/webhook
        send_resolved: false
