# Prometheus pulls numbers every 5 seconds, so Grafana moves in near real time.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api            # requests, latency, predictions, drift, pipeline journal, registry
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: mlflow         # tracking server
    static_configs: [{ targets: ["mlflow:5000"] }]
  - job_name: host           # CPU, memory, disk of the server
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus     # Prometheus watching itself
    static_configs: [{ targets: ["localhost:9090"] }]
