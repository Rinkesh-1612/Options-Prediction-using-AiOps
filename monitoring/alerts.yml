groups:
  - name: optpred
    rules:
      - alert: DriftDetected          # Alertmanager -> API webhook -> retrain request (cooldown 1 h)
        expr: drift_detected == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Input drift: more than 30% of features have PSI > 0.25 against the training days"
      - alert: ModelLosing            # served trades lost money over the last hour -> retrain request
        expr: delta(signal_net_rupees_cum[1h]) < -2000 and on() sum(increase(signal_outcomes_total[1h])) >= 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Served trades lost more than Rs 2000 in the last hour"
      - alert: LowHitRate
        expr: >
          sum(increase(signal_outcomes_total{result="win"}[1h]))
          / sum(increase(signal_outcomes_total[1h])) < 0.35
          and sum(increase(signal_outcomes_total[1h])) >= 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Fewer than 35% of served trades won in the last hour"
      - alert: ModelServiceDown
        expr: model_service_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The MLflow model server does not answer"
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
      - alert: ComponentDown          # blackbox probe of the web page or the model server failed
        expr: probe_success == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} does not answer"
      - alert: RunnerDown             # the retrain runner stopped looping (it touches a file every 15 s)
        expr: runner_heartbeat_age_seconds > 120
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The retrain runner has not looped for 2 minutes"
      - alert: PipelineStageFailed
        expr: pipeline_last_run_ok == 0
        for: 10s
        labels: { severity: warning }
        annotations:
          summary: "The last run of stage {{ $labels.stage }} failed"
      - alert: SlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile API time is above 1 second"
      - alert: BadDataRate              # the clean stage dropped more than 1% of in-session rows of a table
        expr: data_rows_dropped_share > 0.01
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "More than 1% of in-session {{ $labels.table }} rows were dropped as bad data"
