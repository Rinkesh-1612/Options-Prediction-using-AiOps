# The serving stack. Frontend and backend are separate services that meet only over REST.
#   ./stack up -d --build        (the wrapper sets your user id so files stay yours)
# Pipeline stages (dvc.yaml) run with ./pipe, not here.
name: optpred

x-user: &user "${HOST_UID:-1000}:${HOST_GID:-1000}"
x-bind: &bind "${BIND:-127.0.0.1}"   # set BIND=0.0.0.0 to reach it from other machines
# Three services run the same image. Each carries the build recipe, so compose builds it locally
# (layers are cached, so the 2nd and 3rd are instant) and never tries to download it.
x-serve-build: &serve_build { context: ., dockerfile: docker/Dockerfile.serve }

services:
  mlflow:                      # experiment tracking UI + model registry
    build: *serve_build
    image: optpred-serve:latest
    user: *user
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////app/mlflow/mlflow.db",
              "--default-artifact-root", "/app/mlflow/artifacts",
              "--expose-prometheus", "/tmp/mlflow-prom",
              "--allowed-hosts", "mlflow:5000,localhost:*,127.0.0.1:*,10.*,172.*,192.168.*"]
    volumes: ["./mlflow:/app/mlflow"]
    ports: ["${BIND:-127.0.0.1}:5050:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  model:                       # `mlflow models serve` of the champion; follows the registry alias
    build: *serve_build
    image: optpred-serve:latest
    user: *user
    command: ["bash", "/app/scripts/serve_model.sh"]
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow/mlflow.db
      MODEL_NAME: nifty-signal
      START_TIMEOUT: ${START_TIMEOUT:-180}   # a new champion that is not healthy by then is rolled back
    volumes: ["./mlflow:/app/mlflow", "./scripts:/app/scripts:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5001/ping')"]
      interval: 15s
      retries: 6
      start_period: 40s
    depends_on: [mlflow]
    restart: unless-stopped

  api:                         # signal API: the only thing the web page and Ravion talk to
    build: *serve_build
    image: optpred-serve:latest
    user: *user
    command: ["python", "-m", "uvicorn", "--factory", "optpred.serving.signal_api:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_URL: http://model:5001
      MODEL_NAME: nifty-signal
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow/mlflow.db
      FEAT_DIR: /app/data/feat
      GRID_DIR: /app/data/grid
      VOL_MODEL_NAME: nifty-vol
      LABEL_DIR: /app/data/labels
      DAYS_PATH: /app/data/days.json
      ZOO_DIR: /app/reports/zoo
      DRIFT_REF: /app/reports/drift/reference.json
      RUNS_PATH: /app/runs/runs.jsonl
      REPORTS_DIR: /app/reports
      DVC_PATH: /app/dvc.yaml
      LOGS_ROOT: /app/logs
      RETRAIN_REQUEST: /app/state/retrain_request.json
      PIPELINE_REQUEST: /app/state/pipeline_request.json
      RETRAIN_COOLDOWN_S: ${RETRAIN_COOLDOWN_S:-3600}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data:ro          # the parent folder: DVC recreates data/feat and data/labels on each run
      - ./reports:/app/reports:ro
      - ./runs:/app/runs:ro
      - ./logs:/app/logs:ro
      - ./dvc.yaml:/app/dvc.yaml:ro
      - ./state:/app/state
      - ./mlflow:/app/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      retries: 6
      start_period: 20s
    depends_on: [model]
    ports: ["${BIND:-127.0.0.1}:8000:8000"]
    restart: unless-stopped

  frontend:                    # static page; reaches the backend through API_URL (a browser address)
    build: ./frontend
    environment:
      API_URL: ${API_URL:-http://127.0.0.1:8000}
      MLFLOW_URL: ${MLFLOW_URL:-http://127.0.0.1:5050}
      GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3001}
    ports: ["${BIND:-127.0.0.1}:8080:80"]
    restart: unless-stopped

  runner:                      # retrains when the API writes state/retrain_request.json
    build: { context: ., dockerfile: docker/Dockerfile.pipeline }
    image: optpred-pipeline:latest
    user: *user
    working_dir: /app
    command: ["bash", "scripts/runner.sh"]
    environment: { HOME: /tmp, RETRAIN_EVERY_S: "${RETRAIN_EVERY_S:-0}" }
    volumes:
      - ./:/app
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    restart: unless-stopped

  # ---- monitoring: Prometheus pulls, Alertmanager routes drift to the API, Grafana draws ----
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["${BIND:-127.0.0.1}:9091:9090"]      # 9090 belongs to another project on this server
    depends_on: [api]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on: [api]
    restart: unless-stopped

  blackbox:                    # probes the web page and the model server (they have no /metrics)
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped

  node-exporter:               # host CPU, memory, disk
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # read-only dashboards for the demo, no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/optpred.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["${BIND:-127.0.0.1}:3001:3000"]      # 3000 belongs to another project on this server
    depends_on: [prometheus]
    restart: unless-stopped

  replay:                      # demo only: `./stack --profile demo up -d replay`
    profiles: [demo]
    build: *serve_build
    image: optpred-serve:latest
    user: *user
    command: ["python", "/app/scripts/replay.py", "--api", "http://api:8000", "--delay", "${REPLAY_DELAY:-0.2}"]
    volumes: ["./scripts:/app/scripts:ro"]
    depends_on: [api]
    restart: "no"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
