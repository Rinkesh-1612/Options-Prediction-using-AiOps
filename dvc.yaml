stages:
  export:
    cmd: python -m optpred.export
    params:
    - export
    deps:
    - src/optpred/export.py
    outs:
    - data/raw:
        persist: true     # a re-run only adds missing days; never wipes the snapshot

  check:
    cmd: python -m optpred.check
    params:
    - check
    - spark
    deps:
    - src/optpred/check.py
    - src/optpred/spark_common.py
    - data/raw
    outs:
    - data/days.json:
        cache: false      # small, committed to git so the day list is reviewable
    metrics:
    - reports/quality.json:
        cache: false

  bars:
    cmd: python -m optpred.bars
    params:
    - bars
    - spark
    deps:
    - src/optpred/bars.py
    - src/optpred/spark_common.py
    - data/raw
    - data/days.json
    outs:
    - data/bars

  ticks:
    # v2 (docs/V2_PROTOCOL.md): Spark, raw ticks -> one row per contract per second with order-flow measures
    cmd: python -m optpred.ticks
    params:
      - ticks
      - spark
    deps:
      - src/optpred/ticks.py
      - src/optpred/spark_common.py
      - data/raw
      - data/days.json
    outs:
      - data/ticks

  features:
    cmd: python -m optpred.features
    params:
    - features
    - costs
    - bars
    deps:
    - src/optpred/features.py
    - src/optpred/labels.py
    - data/bars
    - data/days.json
    outs:
    - data/features
    metrics:
    - reports/features.json:
        cache: false

  baselines:
    cmd: python -m optpred.baselines
    params:
    - features
    - costs
    - baselines
    deps:
    - src/optpred/baselines.py
    - src/optpred/sim.py
    - src/optpred/labels.py
    - data/features
    metrics:
    - reports/baselines.json:
        cache: false

  tune:
    # Ray Tune: walk-forward search of LightGBM settings on TRAIN days only. Logs a run to MLflow.
    cmd: python -m optpred.tune
    params:
    - features
    - costs
    - train
    - tune
    - mlflow
    deps:
    - src/optpred/tune.py
    - src/optpred/labels.py
    - data/features
    metrics:
    - reports/tune.json:
        cache: false

  train:
    # Tracking goes to MLflow (mlflow/ is its own versioned store: runs, params, metrics, models).
    # The DVC output is a small summary that the register stage reads.
    # It only reads train/val days; the test days are filtered out at the Parquet reader.
    cmd: python -m optpred.train
    params:
    - features
    - costs
    - baselines
    - train
    - mlflow
    deps:
    - src/optpred/train.py
    - src/optpred/baselines.py
    - src/optpred/sim.py
    - src/optpred/labels.py
    - data/features
    metrics:
    - reports/train.json:
        cache: false

  register:
    # Moves the registry aliases: candidate = newest version; champion only if strictly better on validation.
    cmd: python -m optpred.register
    params:
    - mlflow
    deps:
    - src/optpred/register.py
    - reports/train.json
    outs:
    - reports/register.json:
        cache: false

  evaluate:
    # The ONE look at the locked test days (docs/FINAL_TEST_PROTOCOL.md). Scores the registry's champion.
    # Frozen after its single run, so `dvc repro` never opens the test days again.
    cmd: python -m optpred.evaluate --final
    params:
    - baselines
    - costs
    - features
    - mlflow
    deps:
    - data/features
    - reports/register.json
    - src/optpred/evaluate.py
    metrics:
    - reports/final.json:
        cache: false
    frozen: true

  micro:
    # v2: one row per decision second, microstructure inputs, triple-barrier trades for the ATM call and put
    cmd: python -m optpred.micro
    params:
      - micro
      - costs
    deps:
      - src/optpred/micro.py
      - src/optpred/labels.py
      - data/ticks
      - data/features
      - data/splits.json
    outs:
      - data/micro
    metrics:
      - reports/micro.json:
          cache: false

  micro_train:
    # v2 model: walk-forward on the 39 development days, tau from out-of-fold results, registered model
    cmd: python -m optpred.micro_train
    params:
      - micro
      - micro_train
      - costs
      - baselines
      - mlflow
    deps:
      - src/optpred/micro_train.py
      - src/optpred/register.py
      - src/optpred/sim.py
      - data/micro
    metrics:
      - reports/micro_train.json:
          cache: false

  micro_evaluate:
    # The ONE look at the forward days for v2 (plus the disclosed second look at the v1 test days).
    cmd: python -m optpred.micro_evaluate --final
    params:
      - micro
      - micro_train
      - costs
      - baselines
      - mlflow
    deps:
      - src/optpred/micro_evaluate.py
      - reports/micro_train.json
      - data/micro
    metrics:
      - reports/micro_final.json:
          cache: false


  sprint:
    # The six pre-registered alpha-sprint trials (docs/ALPHA_SPRINT.md), out of fold, 99% pass bar
    cmd: python -m optpred.sprint
    params:
      - micro
      - micro_train
      - baselines
      - mlflow
    deps:
      - src/optpred/sprint.py
      - src/optpred/micro_train.py
      - data/micro
    metrics:
      - reports/sprint.json:
          cache: false
