stages:
  export:
    cmd: python -m optpred.data.export
    params:
    - export
    deps:
    - src/optpred/data/export.py
    outs:
    - data/raw:
        persist: true     # a re-run only adds missing days; never wipes the snapshot

  check:
    cmd: python -m optpred.data.check
    params:
    - check
    - spark
    deps:
    - src/optpred/data/check.py
    - src/optpred/common/spark.py
    - data/raw
    outs:
    - data/days.json:
        cache: false      # small, committed to git so the day list is reviewable
    metrics:
    - reports/quality.json:
        cache: false

  clean:
    # EDA rules (docs/steps/eda.md): raw -> clean, every dropped row / nulled field counted
    cmd: python -m optpred.eda.clean
    params:
    - eda
    deps:
    - src/optpred/eda/clean.py
    - src/optpred/eda/rules.py
    - data/raw
    - data/days.json
    outs:
    - data/clean
    metrics:
    - reports/eda/cleaning.json:
        cache: false

  eda:
    cmd: python -m optpred.eda.profile
    params:
    - eda
    deps:
    - src/optpred/eda/profile.py
    - src/optpred/eda/fill.py
    - data/clean
    - data/days.json
    outs:
    - reports/eda/coverage.png:
        cache: false
    - reports/eda/intraday.png:
        cache: false
    - reports/eda/spread_premium.png:
        cache: false
    - reports/eda/index_returns.png:
        cache: false
    metrics:
    - reports/eda/profile.json:
        cache: false

  grid:
    # model-ready 1-second table: index, future, ATM+-2 option legs, ATM chain (docs/steps/cleaning_transformation.md)
    cmd: python -m optpred.transform.grid
    params:
    - grid
    - eda
    deps:
    - src/optpred/transform/grid.py
    - src/optpred/eda/fill.py
    - data/clean
    - data/days.json
    outs:
    - data/grid
    metrics:
    - reports/grid.json:
        cache: false

  feat:
    # feature library: every registered feature over data/grid (docs/steps/feature_engineering.md)
    cmd: python -m optpred.featurelib.build
    params:
    - feat
    deps:
    - src/optpred/featurelib
    - data/grid
    - data/days.json
    outs:
    - data/feat
    metrics:
    - reports/feat.json:
        cache: false
    - reports/feature_catalog.md:
        cache: false

  labels:
    # triple-barrier targets (docs/steps/model_selection.md)
    cmd: python -m optpred.labels.barrier
    params:
    - labels
    - grid
    deps:
    - src/optpred/labels
    - data/grid
    - data/days.json
    outs:
    - data/labels
    metrics:
    - reports/labels.json:
        cache: false

  zoo_train:
    # walk-forward CV of every model family on dev days; Ray Tune + MLflow (docs/steps/model_training.md)
    cmd: python -m optpred.zoo.train
    params:
    - zoo
    deps:
    - src/optpred/zoo
    - data/feat
    - data/labels
    - data/days.json
    - reports/feat.json
    metrics:
    - reports/zoo/cv.json:
        cache: false
    - reports/zoo/importance.json:
        cache: false

  zoo_eval:
    # best setting per family on test days; champion chosen on CV, registered in MLflow
    cmd: python -m optpred.zoo.evaluate
    params:
    - zoo
    deps:
    - src/optpred/zoo
    - data/feat
    - data/labels
    - reports/zoo/cv.json
    metrics:
    - reports/zoo/test.json:
        cache: false
    - reports/zoo/comparison.md:
        cache: false

  drift:
    # drift over time: PSI of every day vs the dev days; writes the reference the API uses online
    cmd: python -m optpred.drift.track
    params:
    - drift
    - zoo.n_test_days
    deps:
    - src/optpred/drift
    - data/feat
    - data/labels
    outs:
    - reports/drift/reference.json:
        cache: false
    - reports/drift/daily.png:
        cache: false
    metrics:
    - reports/drift/daily.json:
        cache: false

  vol:
    # volatility forecaster vs the option market's implied move (docs/steps/vol_model.md)
    cmd: python -m optpred.vol.stage
    params:
    - vol
    - zoo.n_test_days
    - zoo.min_train_days
    - zoo.val_days
    deps:
    - src/optpred/vol
    - data/grid
    - data/feat
    - data/days.json
    outs:
    - reports/vol/test_scatter.png:
        cache: false
    metrics:
    - reports/vol/cv.json:
        cache: false
    - reports/vol/test.json:
        cache: false
    - reports/vol/comparison.md:
        cache: false

  modelout:
    # what every model said at every minute of every day: read by the web page (docs/steps/ui.md)
    cmd: python -m optpred.modelout.stage
    params:
    - vol
    - zoo.n_test_days
    - zoo.min_train_days
    - zoo.val_days
    - zoo.cpus
    deps:
    - src/optpred/modelout
    - src/optpred/zoo
    - src/optpred/vol
    - data/grid
    - data/feat
    - data/labels
    - data/days.json
    - reports/zoo/cv.json
    outs:
    - data/modelout
    metrics:
    - reports/modelout.json:
        cache: false
