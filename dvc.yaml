stages:
  export:
    cmd: python -m optpred.export
    params:
      - export
    deps:
      - src/optpred/export.py
    outs:
      - data/raw:
          persist: true   # a re-run only adds missing days; never wipes the snapshot

  check:
    cmd: python -m optpred.check
    params:
      - check
      - spark
    deps:
      - src/optpred/check.py
      - src/optpred/spark_common.py
      - data/raw
    outs:
      - data/days.json:
          cache: false    # small, committed to git so the day list is reviewable
    metrics:
      - reports/quality.json:
          cache: false

  bars:
    cmd: python -m optpred.bars
    params:
      - bars
      - spark
    deps:
      - src/optpred/bars.py
      - src/optpred/spark_common.py
      - data/raw
      - data/days.json
    outs:
      - data/bars

  features:
    cmd: python -m optpred.features
    params:
      - features
      - costs
      - bars
    deps:
      - src/optpred/features.py
      - src/optpred/labels.py
      - data/bars
      - data/days.json
    outs:
      - data/features
    metrics:
      - reports/features.json:
          cache: false

  baselines:
    cmd: python -m optpred.baselines
    params:
      - features
      - costs
      - baselines
    deps:
      - src/optpred/baselines.py
      - src/optpred/sim.py
      - src/optpred/labels.py
      - data/features
    metrics:
      - reports/baselines.json:
          cache: false

  tune:
    # Ray Tune: walk-forward search of LightGBM settings on TRAIN days only. Logs a run to MLflow.
    cmd: python -m optpred.tune
    params:
      - features
      - costs
      - train
      - tune
      - mlflow
    deps:
      - src/optpred/tune.py
      - src/optpred/labels.py
      - data/features
    metrics:
      - reports/tune.json:
          cache: false

  train:
    # Tracking goes to MLflow (mlflow/ is its own versioned store: runs, params, metrics, models).
    # The DVC output is a small summary that the register stage reads.
    # It only reads train/val days; the test days are filtered out at the Parquet reader.
    cmd: python -m optpred.train
    params:
      - features
      - costs
      - baselines
      - train
      - mlflow
    deps:
      - src/optpred/train.py
      - src/optpred/baselines.py
      - src/optpred/sim.py
      - src/optpred/labels.py
      - data/features
    metrics:
      - reports/train.json:
          cache: false

  register:
    # Moves the registry aliases: candidate = newest version; champion only if strictly better on validation.
    cmd: python -m optpred.register
    params:
      - mlflow
    deps:
      - src/optpred/register.py
      - reports/train.json
    outs:
      - reports/register.json:
          cache: false

  evaluate:
    # The ONE look at the locked test days (docs/FINAL_TEST_PROTOCOL.md). Scores the registry's champion.
    # Frozen after its single run, so `dvc repro` never opens the test days again.
    cmd: python -m optpred.evaluate --final
    params:
      - features
      - costs
      - baselines
      - mlflow
    deps:
      - src/optpred/evaluate.py
      - reports/register.json
      - data/features
    metrics:
      - reports/final.json:
          cache: false
