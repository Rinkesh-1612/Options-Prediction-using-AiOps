server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;
  add_header Cache-Control "no-store";
  location / { try_files $uri $uri/ =404; }
  # the pinned chart library never changes: let the browser keep it
  location /vendor/ { add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
}
